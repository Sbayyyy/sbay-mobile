services:
  app:
    build:
      context: .
    image: ${DOCKER_IMAGE:-sbay-mobile:dev}
    env_file:
      - .env
    environment:
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle-cache:/root/.gradle
    command: npx expo start --lan --port 8081

  android-build:
    build:
      context: .
    image: ${DOCKER_IMAGE:-sbay-mobile:dev}
    profiles:
      - build
    env_file:
      - .env
      - .env.android-signing.local
    environment:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      ANDROID_UPLOAD_KEYSTORE: /run/secrets/upload-keystore.jks
    volumes:
      - .:/app
      - ./@sbay-organization__sbay-mobile.jks:/run/secrets/upload-keystore.jks:ro
      - node_modules:/app/node_modules
      - gradle-cache:/root/.gradle
    command: npm run build:android

volumes:
  node_modules:
  gradle-cache:
